name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build unsigned Windows and macOS installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Isolate test data
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, folder in [
                  ('NOTES_DIR', 'twill-notes'),
                  ('NOTE_APP_SKILLBOOK_DIR', 'twill-skillbook'),
                  ('NOTE_APP_SMOKE_USER_DATA', 'twill-electron-profile'),
              ]:
                  print(f'{name}={Path(os.environ["RUNNER_TEMP"]) / folder}', file=output)
      - name: Set up Windows dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: call window\setup.bat
      - name: Set up macOS dependencies
        if: runner.os == 'macOS'
        run: /bin/bash mac/setup.sh
      - name: Test backend on Windows
        if: runner.os == 'Windows'
        working-directory: backend
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests
      - name: Test backend on macOS
        if: runner.os == 'macOS'
        working-directory: backend
        run: .venv/bin/python -m unittest discover -s tests
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Check desktop scripts
        working-directory: frontend
        run: npm run desktop:check
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Smoke test desktop
        working-directory: frontend
        timeout-minutes: 3
        run: npm run desktop:smoke

  installers:
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: call window\build-installer.bat
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: /bin/bash mac/build-installer.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Twill-${{ runner.os }}-${{ runner.arch }}
          path: |
            frontend/release/Twill-Setup-*.exe
            frontend/release/Twill-*.dmg
          if-no-files-found: error
          retention-days: 14
