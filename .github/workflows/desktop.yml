name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build unsigned Windows and macOS installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Isolate test data
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, folder in [
                  ('NOTES_DIR', 'twill-notes'),
                  ('NOTE_APP_SKILLBOOK_DIR', 'twill-skillbook'),
                  ('NOTE_APP_SMOKE_USER_DATA', 'twill-electron-profile'),
              ]:
                  print(f'{name}={Path(os.environ["RUNNER_TEMP"]) / folder}', file=output)
      - name: Set up Windows dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: call window\setup.bat
      - name: Set up macOS dependencies
        if: runner.os == 'macOS'
        run: /bin/bash mac/setup.sh
      - name: Test backend on Windows
        if: runner.os == 'Windows'
        working-directory: backend
        run: |
          $testOutput = & .\.venv\Scripts\python.exe -m unittest discover -s tests 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host $_ }
          if ($testExitCode -ne 0) {
            $failure = ($testOutput | Select-Object -Last 100) -join "`n"
            $failure = $failure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows backend tests::$failure"
            exit $testExitCode
          }
      - name: Test backend on macOS
        if: runner.os == 'macOS'
        working-directory: backend
        run: .venv/bin/python -m unittest discover -s tests
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Check desktop scripts
        working-directory: frontend
        run: npm run desktop:check
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Smoke test desktop
        working-directory: frontend
        timeout-minutes: 3
        run: npm run test:desktop-shutdown
      - name: Verify document and clipboard UI
        working-directory: frontend
        timeout-minutes: 5
        run: node test/viewerRegressions.cjs

  installers:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_installers)
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        run: call window\build-installer.bat
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: /bin/bash mac/build-installer.sh
      - name: Select packaged executable
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          pattern = 'win-unpacked/Twill.exe' if os.name == 'nt' else 'mac*/Twill.app/Contents/MacOS/Twill'
          binaries = list(Path('frontend/release').glob(pattern))
          if len(binaries) != 1:
              raise RuntimeError(f'Expected one packaged executable, found {binaries}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              print(f'TWILL_QA_DESKTOP_EXECUTABLE={binaries[0].resolve()}', file=output)
      - name: Verify packaged app releases all processes
        working-directory: frontend
        timeout-minutes: 3
        run: npm run test:desktop-shutdown
      - name: Verify network fix in packaged backend
        shell: python {0}
        run: |
          import os
          import subprocess
          from pathlib import Path
          pattern = 'win-unpacked/resources/backend/twill-backend/twill-backend.exe' if os.name == 'nt' else 'mac*/Twill.app/Contents/Resources/backend/twill-backend/twill-backend'
          binaries = list(Path('frontend/release').glob(pattern))
          if len(binaries) != 1:
              raise RuntimeError(f'Expected one packaged backend, found {binaries}')
          python = Path('backend/.venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), 'scripts/verify_packaged_backend.py', str(binaries[0])], check=True)
      - uses: actions/upload-artifact@v7
        with:
          name: Twill-${{ runner.os }}-${{ runner.arch }}
          path: |
            frontend/release/Twill-Setup-*.exe
            frontend/release/Twill-*.dmg
          if-no-files-found: error
          retention-days: 14
